[package]
name = "almighty-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "almightyd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
portable-pty = "0.9"
vt100 = "0.18"
regex = "1"
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
dirs = "6"
wasmtime = { version = "51", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
wasmtime-wasi = { version = "51", default-features = false, features = ["p2"] }
toml = "1"
ureq = "3"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hmac = "0.12"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
toml = "1"
base64 = "0.22"
rand = "0.9"
