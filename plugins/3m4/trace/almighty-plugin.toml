# trace: run logs, spans and audit. A service plugin: the app runs on its own (here on its
# local development port); almighty embeds its pages and exchanges signed events.
# Change base_url to where your instance listens.
id = "net.3m4.trace"
name = "trace"
version = "0.1.0"
kind = "service"
license = "MIT"

[service]
base_url = "http://localhost:8091"
well_known = "/.well-known/m4.json"
mcp = "/mcp"

[permissions]
items = ["write"]
events = ["item.created"]

[[panels]]
id = "traces"
title = "Traces"
type = "web"
url = "/embed/traces"

[[resources]]
type = "traces"
embed = "/embed/traces/{id}"
