# sketch: UI mocks and drawings. A service plugin: the app runs on its own (here on its
# local development port); almighty embeds its pages and exchanges signed events.
# Change base_url to where your instance listens.
id = "net.3m4.sketch"
name = "sketch"
version = "0.1.0"
kind = "service"
license = "MIT"

[service]
base_url = "http://localhost:8089"
well_known = "/.well-known/m4.json"
mcp = "/mcp"

[permissions]
items = ["write"]

[[panels]]
id = "sketches"
title = "Sketches"
type = "web"
url = "/embed/sketches"

[[resources]]
type = "sketches"
embed = "/embed/sketches/{id}"
